name: Gazeta

on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
    - cron: "0 1,5,9,13,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gazeta

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          pip install requests pillow
      - name: Обновление страницы и отправка газеты
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SEND: ${{ github.event.schedule == '0 1,5,9,13,17,21 * * *' || github.event_name == 'workflow_dispatch' }}
        run: python bot.py
      - name: Сохранение страницы
        if: always()
        run: |
          git config user.name "gazeta-bot"
          git config user.email "gazeta-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "update" && git push)
